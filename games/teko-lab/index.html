<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>てこの働き研究所｜小6理科</title>
<meta name="description" content="分銅をドラッグしててこにのせ、釣り合いを実験。重さ×距離は隠して発見できる、iPad最適化の小6理科教材。">
<style>
/* =========================================================
   てこの働き研究所 ── 小6理科
   ・分銅をドラッグして各位置(1〜6)にのせる
   ・iPad1画面完結（ページはスクロールしない）
   ・重さ×距離の数字はトグルで表示/非表示（初期は非表示）
   Vanilla JS + CSS + SVG（外部ライブラリなし）
   ========================================================= */
:root{
  --sky:#3aa0e6;--sky-d:#2b7fc0;--coral:#ff6f61;--coral-d:#e2564a;
  --grass:#3fb28a;--grass-d:#2f8768;--sun:#ffcf3f;--purple:#9b6dbf;
  --ink:#2b3a45;--ink-soft:#6a7a85;--paper:#f3f8fc;--card:#fff;--line:#d6e6f0;
  --shadow:0 6px 18px -8px rgba(43,58,69,.35);--radius:14px;
  --font:'Hiragino Maru Gothic ProN','Yu Gothic UI','Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.6;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
body.no-ruby rt{display:none;}
rt{font-size:.55em;color:var(--ink-soft);font-weight:400;}
svg{max-width:100%;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--sky-d);}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important;}}

.app{max-width:1000px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:0 12px;}

/* ヘッダー（コンパクト） */
header.site{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:8px 2px;}
.logo{display:flex;align-items:center;gap:8px;min-width:0;}
.logo h1{font-size:clamp(15px,3.4vw,20px);font-weight:800;white-space:nowrap;}
.logo .sub{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.toggles{display:flex;gap:8px;flex-wrap:wrap;}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;background:#e9f2fa;padding:5px 12px;border-radius:100px;border:2px solid transparent;color:var(--ink);font-weight:800;}
.tg .state{background:var(--ink-soft);color:#fff;border-radius:100px;padding:1px 9px;font-size:12px;min-width:34px;text-align:center;}
.tg[aria-pressed="true"]{border-color:var(--sky);}
.tg[aria-pressed="true"] .state{background:var(--sky);}

/* タブ */
nav.tabs{flex:0 0 auto;display:flex;gap:8px;}
.tab{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px 12px 0 0;padding:9px;font-weight:800;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:none;}
.tab .ic{font-size:19px;}
.tab[aria-selected="true"]{color:#fff;background:var(--sky);border-color:var(--sky);}

/* パネル本体（残り全部を使う） */
main{flex:1;min-height:0;display:flex;padding:8px 0 10px;}
.panel{flex:1;min-height:0;display:none;}
.panel.active{display:flex;flex-direction:column;gap:7px;}

/* ツールバー（分銅トレイ＋ボタン） */
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tray{display:flex;align-items:center;gap:8px;}
.tray .lbl{font-size:12px;font-weight:800;color:var(--ink-soft);}
.weight-src{border:none;background:transparent;padding:2px;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;}
.weight-src svg{width:38px;height:40px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
.weight-src span{font-size:12px;font-weight:800;margin-top:-2px;}
.spacer{flex:1;}
.btn{border:2px solid var(--sky);background:var(--card);color:var(--sky-d);border-radius:11px;padding:8px 13px;font-weight:800;font-size:14px;}
.btn.primary{background:var(--sky);color:#fff;}
.btn.coral{border-color:var(--coral);color:var(--coral-d);}
.btn.coral.on{background:var(--coral);color:#fff;}
.btn.grass{border-color:var(--grass);color:var(--grass-d);}
.btn.grass.on{background:var(--grass);color:#fff;}
.btn.ghost{border-color:var(--line);color:var(--ink-soft);}

/* ステージ（残り高さいっぱい） */
.stage{flex:1;min-height:0;background:linear-gradient(#eef7ff,#fdfdff);border:1px solid var(--line);border-radius:14px;position:relative;touch-action:none;}
.stage svg{width:100%;height:100%;display:block;}
.drop-hint{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--sky-d);opacity:.85;pointer-events:none;}

/* 読み取り（コンパクト） */
.readout{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:12px;text-align:center;}
.mbox{background:var(--card);border:2px solid var(--line);border-radius:11px;padding:5px 12px;min-width:98px;}
.mbox .cap{font-size:11px;font-weight:800;}
.mbox.l .cap{color:var(--sky-d);}
.mbox.r .cap{color:var(--coral-d);}
.mbox .v{font-size:19px;font-weight:800;}
.mbox .v.hidden{color:var(--ink-soft);}
.state-text{font-size:clamp(16px,3.6vw,21px);font-weight:800;min-width:130px;}
.state-text.balance{color:var(--grass-d);}
.state-text.left{color:var(--sky-d);}
.state-text.right{color:var(--coral-d);}

/* チャレンジ */
.mode-row{flex:0 0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.mode-row .btn{font-size:14px;}
.cleared{font-size:13px;font-weight:800;color:var(--grass-d);}
.prompt{flex:0 0 auto;background:#fffbe9;border:2px dashed var(--sun);border-radius:11px;padding:8px 12px;font-weight:800;font-size:14px;}
.msgbar{flex:0 0 auto;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.feedback{font-weight:800;font-size:16px;text-align:center;}
.feedback.ok{color:var(--grass-d);}
.feedback.ng{color:var(--coral-d);}
.guess-choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.guess-choices .btn{font-size:16px;padding:9px 18px;}

/* ドラッグ中のクローン分銅 */
.drag-clone{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%);opacity:.9;}
.drag-clone svg{width:44px;height:46px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3));}

@media (max-width:520px){
  .mbox{min-width:78px;}
  .state-text{min-width:0;}
  .weight-src svg{width:34px;height:36px;}
}
</style>
</head>
<body>
<div class="app">

  <header class="site">
    <div class="logo">
      <span style="font-size:26px">⚖️</span>
      <div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <h1>てこの<ruby>働<rt>はたら</rt></ruby>き<ruby>研究所<rt>けんきゅうじょ</rt></ruby></h1>
          <span class="sub">小6理科</span>
        </div>
      </div>
    </div>
    <div class="toggles">
      <button class="tg" id="numToggle" aria-pressed="false">数字 <span class="state" id="numState">OFF</span></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="jikken"><span class="ic">⚗️</span>じっけん</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="challenge"><span class="ic">🏅</span>チャレンジ</button>
  </nav>

  <main>

    <!-- ======== じっけん ======== -->
    <section class="panel active" id="panel-jikken" role="tabpanel">
      <div class="toolbar">
        <div class="tray" id="expTray"><span class="lbl">分銅：</span></div>
        <span class="spacer"></span>
        <button class="btn ghost" id="expUndo">ひとつ戻す</button>
        <button class="btn coral" id="expReset">ぜんぶ外す</button>
      </div>
      <div class="stage" id="expStage">
        <div class="drop-hint">分銅を位置(1〜6)にドラッグしてのせる ｜ 分銅を長押しで外す</div>
        <svg viewBox="0 0 620 300" id="expSvg" role="img" aria-label="実験用のてこ"></svg>
      </div>
      <div class="readout">
        <div class="mbox l"><div class="cap">左 ＝ 重さ×きょり</div><div class="v" id="expMomL">？</div></div>
        <div class="state-text" id="expState">？</div>
        <div class="mbox r"><div class="cap">右 ＝ 重さ×きょり</div><div class="v" id="expMomR">？</div></div>
      </div>
    </section>

    <!-- ======== チャレンジ ======== -->
    <section class="panel" id="panel-challenge" role="tabpanel">
      <div class="mode-row">
        <button class="btn grass" id="modeBalance">つり合わせ</button>
        <button class="btn coral" id="modeGuess">重さ当て</button>
        <span class="spacer"></span>
        <span class="cleared" id="chCleared">クリア 0問</span>
      </div>
      <div class="prompt" id="chPrompt">上のボタンでゲームをえらんでね。</div>
      <div class="toolbar">
        <div class="tray" id="chTray"><span class="lbl">分銅：</span></div>
        <span class="spacer"></span>
        <button class="btn ghost" id="chUndo">ひとつ戻す</button>
        <button class="btn coral" id="chClear">ぜんぶ外す</button>
        <button class="btn primary" id="chNext" style="display:none">つぎの問題 →</button>
      </div>
      <div class="stage" id="chStage">
        <div class="drop-hint">分銅を左うで(1〜6)にドラッグしてのせる ｜ 長押しで外す</div>
        <svg viewBox="0 0 620 300" id="chSvg" role="img" aria-label="チャレンジ用のてこ"></svg>
      </div>
      <div class="readout">
        <div class="mbox l"><div class="cap">左 ＝ 重さ×きょり</div><div class="v" id="chMomL">？</div></div>
        <div class="state-text" id="chState">？</div>
        <div class="mbox r"><div class="cap">右</div><div class="v" id="chMomR">？</div></div>
      </div>
      <div class="msgbar">
        <div class="feedback" id="chFeedback"></div>
        <div class="guess-choices" id="chChoices"></div>
      </div>
    </section>

  </main>
</div>

<script>
/* ========== 設定の保存（失敗しても無視） ========== */
const STORE='teko_lab_v3';
let store={ruby:true,nums:false};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(STORE)||'{}'));}catch(e){}
function saveStore(){try{localStorage.setItem(STORE,JSON.stringify(store));}catch(e){}}

/* ========== 分銅のイラスト(SVG) ========== */
const GRAM_COLOR={10:'#3aa0e6',20:'#3fb28a',30:'#ff6f61'};
function fundoSVG(g){
  const c=GRAM_COLOR[g];
  return `<svg viewBox="0 0 40 44" aria-hidden="true"><path d="M13 16 Q13 6 20 6 Q27 6 27 16" fill="none" stroke="${c}" stroke-width="3.5"/><path d="M11 16 L29 16 L33 40 L7 40 Z" fill="${c}" stroke="#fff" stroke-width="1.5"/><text x="20" y="33" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">${g}</text></svg>`;
}
function buildTray(el, ids){
  ids.forEach(g=>{
    const b=document.createElement('button');
    b.className='weight-src'; b.dataset.g=g; b.type='button';
    b.setAttribute('aria-label',g+'グラムの分銅');
    b.innerHTML=fundoSVG(g)+`<span>${g}g</span>`;
    el.appendChild(b);
  });
}

/* ========== てこ共通ロジック ========== */
const PIVOT=310,STEP=42,BB=126;
function emptySide(){const o={};for(let p=1;p<=6;p++)o[p]=[];return o;}
function momentSide(side){let m=0;for(let p=1;p<=6;p++)side[p].forEach(g=>m+=g*p);return m;}
const WT_H=17, WT_GAP=2; // 分銅ブロックの高さ・すき間（数字が重ならないよう確保）
function stackSVG(x,grams,side,pos){
  if(!grams.length)return'';
  let s=`<line x1="${x}" y1="${BB}" x2="${x}" y2="${BB+2}" stroke="#b98a55" stroke-width="3"/>`;
  grams.forEach((g,i)=>{const y=BB+2+i*(WT_H+WT_GAP);
    s+=`<g class="wt" data-side="${side}" data-pos="${pos}" data-idx="${i}">`+
       `<rect x="${x-16}" y="${y}" width="32" height="${WT_H}" rx="4" fill="${GRAM_COLOR[g]}" stroke="#fff" stroke-width="1.5"/>`+
       `<text x="${x}" y="${y+WT_H/2+4}" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">${g}</text></g>`;
  });
  return s;
}
function mysterySVG(x,shown,g){const y=BB+3;
  return `<line x1="${x}" y1="${BB}" x2="${x}" y2="${y}" stroke="#b98a55" stroke-width="3"/>`+
    `<rect x="${x-21}" y="${y}" width="42" height="36" rx="7" fill="#9b6dbf" stroke="#fff" stroke-width="2"/>`+
    `<text x="${x}" y="${y+25}" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">${shown?g:'?'}</text>`;
}
function renderLever(svg,state,opts){
  opts=opts||{};
  const mL=momentSide(state.left);
  const mR=(opts.mysteryMoment!=null)?opts.mysteryMoment:momentSide(state.right);
  let deg=Math.max(-15,Math.min(15,(mR-mL)*0.09));
  let ticks='',stacks='';
  for(let p=1;p<=6;p++){const lx=PIVOT-STEP*p,rx=PIVOT+STEP*p;
    ticks+=`<text x="${lx}" y="108">${p}</text><text x="${rx}" y="108">${p}</text>`;
    stacks+=stackSVG(lx,state.left[p],'left',p)+stackSVG(rx,state.right[p],'right',p);}
  let mystery='';
  if(opts.mystery)mystery=mysterySVG(PIVOT+STEP*opts.mystery.pos,opts.mystery.shown,opts.mystery.g);
  svg.innerHTML=
    `<rect class="dhl" x="0" y="104" width="0" height="196" rx="6" fill="#ffcf3f" opacity="0"/>`+
    `<polygon points="310,120 280,196 340,196" fill="#7fa7c0"/>`+
    `<rect x="250" y="192" width="120" height="8" rx="4" fill="#9fbccf"/>`+
    `<g class="beamGroup" style="transform-box:view-box;transform-origin:310px 120px;transition:transform .6s cubic-bezier(.34,1.15,.5,1);">`+
      `<rect x="46" y="113" width="528" height="13" rx="6" fill="#d8a26a"/>`+
      `<g fill="#9a7b52" font-size="12" font-weight="700" text-anchor="middle">${ticks}</g>${stacks}${mystery}`+
    `</g>`;
  svg.querySelector('.beamGroup').style.transform=`rotate(${deg}deg)`;
}

/* ========== 数字表示のトグル ========== */
function setMoment(el,val){
  if(store.nums){el.textContent=val;el.classList.remove('hidden');}
  else{el.textContent='？';el.classList.add('hidden');}
}
function stateText(el,mL,mR){
  el.className='state-text '+(mL===mR?'balance':(mL>mR?'left':'right'));
  el.textContent=mL===mR?'⚖️ つり合った！':(mL>mR?'左が下がる ⬇️':'⬇️ 右が下がる');
}

/* ========== ドラッグでのせる ========== */
function clientToVB(svg,cx,cy){
  const r=svg.getBoundingClientRect();
  const scale=Math.min(r.width/620,r.height/300);
  const ox=(r.width-620*scale)/2, oy=(r.height-300*scale)/2;
  return {x:(cx-r.left-ox)/scale, y:(cy-r.top-oy)/scale,
          inside:cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom};
}
// tray から svg へドラッグして side/pos を返す
function setupDrag(tray,svg,editable,onDrop){
  let drag=null;
  function hit(cx,cy){
    const v=clientToVB(svg,cx,cy); if(!v.inside)return null;
    const off=v.x-PIVOT; const side=off<0?'left':'right';
    if(!editable[side])return null;
    const p=Math.round(Math.abs(off)/STEP);
    if(p<1||p>6)return null;
    return {side,pos:p};
  }
  function highlight(t){
    const dhl=svg.querySelector('.dhl'); if(!dhl)return;
    if(!t){dhl.setAttribute('opacity','0');return;}
    const x=PIVOT+(t.side==='left'?-1:1)*STEP*t.pos;
    dhl.setAttribute('x',x-STEP/2); dhl.setAttribute('width',STEP); dhl.setAttribute('opacity','0.35');
  }
  tray.querySelectorAll('.weight-src').forEach(src=>{
    src.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const g=Number(src.dataset.g);
      const c=document.createElement('div'); c.className='drag-clone'; c.innerHTML=fundoSVG(g);
      document.body.appendChild(c);
      drag={g,clone:c};
      move(e.clientX,e.clientY);
    });
  });
  function move(x,y){ if(drag&&drag.clone){drag.clone.style.left=x+'px';drag.clone.style.top=y+'px';} }
  window.addEventListener('pointermove',e=>{ if(!drag)return; move(e.clientX,e.clientY); highlight(hit(e.clientX,e.clientY)); },{passive:false});
  window.addEventListener('pointerup',e=>{ if(!drag)return; const t=hit(e.clientX,e.clientY); if(t)onDrop(t.side,t.pos,drag.g); if(drag.clone)drag.clone.remove(); highlight(null); drag=null; });
}

/* ========== 長押しで分銅を外す ========== */
function setupRemove(svg,canRemove,onRemove){
  let lp=null;
  const cancel=()=>{ if(lp){clearTimeout(lp.timer);lp=null;} };
  svg.addEventListener('pointerdown',e=>{
    const wt=e.target.closest('.wt'); if(!wt)return;
    const side=wt.dataset.side,pos=Number(wt.dataset.pos),idx=Number(wt.dataset.idx);
    if(!canRemove(side))return;
    e.preventDefault();
    wt.style.opacity='0.4';
    lp={x:e.clientX,y:e.clientY,el:wt,timer:setTimeout(()=>{lp=null;wt.style.opacity='';onRemove(side,pos,idx);},500)};
  });
  svg.addEventListener('pointermove',e=>{ if(lp&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10)){lp.el.style.opacity='';cancel();} });
  svg.addEventListener('pointerup',()=>{ if(lp)lp.el.style.opacity=''; cancel(); });
  svg.addEventListener('pointercancel',()=>{ if(lp)lp.el.style.opacity=''; cancel(); });
}

/* ========== 数字トグル ========== */
function applyNums(){document.getElementById('numState').textContent=store.nums?'ON':'OFF';document.getElementById('numToggle').setAttribute('aria-pressed',String(store.nums));expRender();chRender();}
document.getElementById('numToggle').addEventListener('click',()=>{store.nums=!store.nums;applyNums();saveStore();});

/* ========== タブ ========== */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===t)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t.dataset.tab));
  expRender();chRender();
}));

/* ========== ① じっけん ========== */
const exp={left:emptySide(),right:emptySide(),order:[]};
const expSvg=document.getElementById('expSvg');
function expRender(){
  renderLever(expSvg,{left:exp.left,right:exp.right},{});
  const mL=momentSide(exp.left),mR=momentSide(exp.right);
  setMoment(document.getElementById('expMomL'),mL);
  setMoment(document.getElementById('expMomR'),mR);
  stateText(document.getElementById('expState'),mL,mR);
}
buildTray(document.getElementById('expTray'),[10,20,30]);
setupDrag(document.getElementById('expTray'),expSvg,{left:true,right:true},(side,pos,g)=>{
  exp[side][pos].push(g); exp.order.push({side,pos}); expRender();
});
setupRemove(expSvg,()=>true,(side,pos,idx)=>{
  exp[side][pos].splice(idx,1);
  for(let i=exp.order.length-1;i>=0;i--){if(exp.order[i].side===side&&exp.order[i].pos===pos){exp.order.splice(i,1);break;}}
  expRender();
});
document.getElementById('expUndo').addEventListener('click',()=>{const o=exp.order.pop();if(o){exp[o.side][o.pos].pop();expRender();}});
document.getElementById('expReset').addEventListener('click',()=>{exp.left=emptySide();exp.right=emptySide();exp.order=[];expRender();});

/* ========== ② チャレンジ ========== */
const ch={mode:null,left:emptySide(),right:emptySide(),order:[],mystery:null,cleared:0,done:false};
const chSvg=document.getElementById('chSvg');
const rand=n=>Math.floor(Math.random()*n);
function chRender(){
  const opts=ch.mode==='guess'&&ch.mystery?{mystery:ch.mystery,mysteryMoment:ch.mystery.g*ch.mystery.pos}:{};
  renderLever(chSvg,{left:ch.left,right:ch.right},opts);
  const mL=momentSide(ch.left);
  setMoment(document.getElementById('chMomL'),mL);
  const rBox=document.getElementById('chMomR');
  if(ch.mode==='guess'){ // 右はなぞ：答えるまで？
    if(ch.mystery&&ch.mystery.shown)setMoment(rBox,ch.mystery.g*ch.mystery.pos);
    else{rBox.textContent='？';rBox.classList.add('hidden');}
  }else setMoment(rBox,momentSide(ch.right));
  const mRn=ch.mode==='guess'&&ch.mystery?ch.mystery.g*ch.mystery.pos:momentSide(ch.right);
  stateText(document.getElementById('chState'),mL,mRn);
}
function newRound(mode){
  ch.mode=mode;ch.left=emptySide();ch.right=emptySide();ch.order=[];ch.done=false;
  document.getElementById('chNext').style.display='none';
  document.getElementById('chChoices').innerHTML='';
  const fb=document.getElementById('chFeedback');fb.textContent='';fb.className='feedback';
  document.getElementById('modeBalance').classList.toggle('on',mode==='balance');
  document.getElementById('modeGuess').classList.toggle('on',mode==='guess');
  if(mode==='balance'){
    const g=[10,20,30][rand(3)],d=2+rand(5);
    ch.right[d]=[g];ch.mystery=null;
    document.getElementById('chPrompt').innerHTML=`🟥 右うで（<b>${g}g・きょり${d}</b>）とつり合うように、左に分銅をのせよう！`;
  }else{
    const g=[20,30,40,50,60][rand(5)],d=2+rand(4);
    ch.mystery={pos:d,g:g,shown:false};
    document.getElementById('chPrompt').innerHTML=`🟣 右の「?」（きょり${d}）を、左の分銅で<b>つり合わせて</b>、重さを当てよう！`;
  }
  chRender();
}
buildTray(document.getElementById('chTray'),[10,20,30]);
setupDrag(document.getElementById('chTray'),chSvg,{left:true,right:false},(side,pos,g)=>{
  if(ch.done||side!=='left')return;
  ch.left[pos].push(g); ch.order.push(pos); afterChange();
});
setupRemove(chSvg,side=>side==='left'&&!ch.done,(side,pos,idx)=>{
  ch.left[pos].splice(idx,1);
  for(let i=ch.order.length-1;i>=0;i--){if(ch.order[i]===pos){ch.order.splice(i,1);break;}}
  afterChange();
});
function afterChange(){
  chRender();
  if(ch.done||!ch.mode)return;
  const mL=momentSide(ch.left);
  if(ch.mode==='balance'){ if(mL>0&&mL===momentSide(ch.right))roundClear('やった！つり合った！ 🎉'); }
  else{ const t=ch.mystery.g*ch.mystery.pos; if(mL===t)showChoices(); else document.getElementById('chChoices').innerHTML=''; }
}
function showChoices(){
  const fb=document.getElementById('chFeedback');fb.textContent='つり合った！右のおもりは何g？';fb.className='feedback';
  const g=ch.mystery.g;const set=new Set([g]);while(set.size<3)set.add([10,20,30,40,50,60][rand(6)]);
  const opts=[...set].sort((a,b)=>a-b);
  document.getElementById('chChoices').innerHTML=opts.map(o=>`<button class="btn coral" data-ans="${o}">${o}g</button>`).join('');
}
document.getElementById('chChoices').addEventListener('click',e=>{
  const b=e.target.closest('[data-ans]');if(!b||ch.done)return;
  if(Number(b.dataset.ans)===ch.mystery.g){ch.mystery.shown=true;chRender();roundClear(`せいかい！ 右のおもりは ${ch.mystery.g}g でした 🎉`);}
  else{const fb=document.getElementById('chFeedback');fb.textContent='ちがうみたい…左のようすと右のきょりから考えよう。';fb.className='feedback ng';}
});
function roundClear(msg){
  ch.done=true;ch.cleared++;
  document.getElementById('chCleared').textContent=`クリア ${ch.cleared}問`;
  const fb=document.getElementById('chFeedback');fb.textContent=msg;fb.className='feedback ok';
  document.getElementById('chChoices').innerHTML='';
  document.getElementById('chNext').style.display='';
}
document.getElementById('chUndo').addEventListener('click',()=>{if(ch.done)return;const p=ch.order.pop();if(p!=null){ch.left[p].pop();afterChange();}});
document.getElementById('chClear').addEventListener('click',()=>{if(ch.done)return;ch.left=emptySide();ch.order=[];afterChange();});
document.getElementById('chNext').addEventListener('click',()=>newRound(ch.mode));
document.getElementById('modeBalance').addEventListener('click',()=>newRound('balance'));
document.getElementById('modeGuess').addEventListener('click',()=>newRound('guess'));

/* ========== 初期化 ========== */
applyNums();
expRender();
newRound('balance');
</script>
</body>
</html>
