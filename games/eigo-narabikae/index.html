<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文法 ならびかえトレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F8;
    --surface:#FFFFFF;
    --ink:#1E293F;
    --ink-soft:#5B6B85;
    --line:#DEE5F0;
    --accent:#FF8A3D;
    --accent-dark:#DB6318;
    --accent-soft:#FFEEDD;
    --accent-grad:linear-gradient(135deg,#FFA25C,#FF7A29);
    --blue:#4C6FFF;
    --blue-soft:#E9EDFF;
    --violet:#8B6BFF;
    --hero-grad:linear-gradient(120deg,#FF8A3D 0%,#FF6F9C 50%,#8B6BFF 100%);
    --correct:#2FAE66;
    --correct-bg:#E6F7ED;
    --incorrect:#E85D5D;
    --incorrect-bg:#FDECEC;
    --radius-lg:28px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-card:0 20px 48px -12px rgba(30,41,63,0.16), 0 2px 8px rgba(30,41,63,0.05);
    --shadow-soft:0 6px 16px rgba(30,41,63,0.08);
    --font-display:'Zen Maru Gothic', sans-serif;
    --font-body:'Noto Sans JP', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(76,111,255,0.045) 0px,
        rgba(76,111,255,0.045) 1px,
        transparent 1px,
        transparent 34px
      ),
      radial-gradient(ellipse 900px 500px at 12% -8%, rgba(255,138,61,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 0%, rgba(139,107,255,0.10), transparent 55%),
      var(--bg);
    font-family:var(--font-body);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 14px 64px;
  }
  #app{width:100%;max-width:460px;}

  .card{
    position:relative;
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:32px 24px 26px;
    animation:cardIn .4s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:5px;
    background:var(--hero-grad);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* ---------- START SCREEN ---------- */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:var(--font-display);
    font-size:11.5px;
    letter-spacing:.16em;
    color:var(--accent-dark);
    font-weight:700;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:'';
    width:7px;height:7px;border-radius:50%;
    background:var(--hero-grad);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .title{
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(26px,7vw,33px);
    line-height:1.28;
    margin:0 0 14px;
    background:linear-gradient(100deg,var(--ink) 40%, var(--accent-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .lead{
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:0 0 24px;
  }
  .set-list{display:flex;flex-direction:column;gap:12px;max-height:58vh;overflow-y:auto;padding:2px 2px 2px 0;margin:0 -2px;}
  .set-card{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:14px 16px;
    transition:border-color .18s ease, transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, background .18s ease;
  }
  .set-card:hover{border-color:transparent;background:#FFFBF8;box-shadow:var(--shadow-soft);transform:translateY(-2px);}
  .set-card:active{transform:translateY(0) scale(0.98);}
  .set-icon{
    flex:0 0 auto;
    width:44px;height:44px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;
    background:var(--accent-soft);
    box-shadow:inset 0 0 0 1px rgba(255,138,61,0.18);
  }
  .set-body{flex:1;min-width:0;}
  .set-card-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
  .set-num{
    font-family:var(--font-display);
    font-weight:700;
    font-size:11.5px;
    color:var(--accent-dark);
    background:var(--accent-soft);
    padding:2.5px 9px;
    border-radius:999px;
  }
  .badge{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--bg);
    padding:2.5px 9px;
    border-radius:999px;
    font-weight:500;
  }
  .set-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;margin-bottom:3px;color:var(--ink);}
  .set-tags{font-size:12px;color:var(--ink-soft);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .set-cta{flex:0 0 auto;font-size:17px;color:var(--accent-dark);transition:transform .15s ease;}
  .set-card:hover .set-cta{transform:translateX(3px);}

  /* ---------- QUIZ SCREEN ---------- */
  .quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:14px;}
  .home-link{
    all:unset;cursor:pointer;font-size:12px;color:var(--ink-soft);font-weight:500;
    display:flex;align-items:center;gap:3px;
    transition:color .15s ease, transform .15s ease;
  }
  .home-link:hover{color:var(--accent-dark);transform:translateX(-2px);}
  .round-label{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-soft);}
  .progress-dots{display:flex;gap:5px;flex:0 0 auto;}
  .dot{width:18px;height:6px;border-radius:4px;background:var(--line);display:inline-block;transition:background .25s ease, transform .25s ease, box-shadow .25s ease;}
  .dot-current{background:var(--hero-grad);transform:scaleY(1.25);box-shadow:0 2px 6px rgba(255,138,61,0.4);}
  .dot-correct{background:var(--correct);}
  .dot-incorrect{background:var(--incorrect);}

  .q-tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--blue);
    background:var(--blue-soft);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:20px;
    box-shadow:inset 0 0 0 1px rgba(76,111,255,0.12);
  }

  .slot-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:20px 16px;
    border-radius:var(--radius-md);
    background:
      radial-gradient(circle at 100% 0%, rgba(76,111,255,0.05), transparent 55%),
      var(--surface);
    border:1.5px dashed var(--line);
    min-height:70px;
    align-content:flex-start;
    margin-bottom:20px;
  }
  .slot{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    padding:9px 15px;
    border-radius:var(--radius-sm);
    min-height:40px;
    display:flex;align-items:center;justify-content:center;
  }
  .slot.empty{
    width:46px;
    border-bottom:2.5px solid var(--line);
    background:transparent;
  }
  .slot.filled{
    all:unset;
    cursor:pointer;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    padding:9px 15px;
    border-radius:var(--radius-sm);
    background:var(--accent-soft);
    color:var(--accent-dark);
    min-height:40px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(255,138,61,0.22);
    animation:popIn .2s cubic-bezier(.3,1.4,.6,1);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .slot.filled:hover{background:#FFDFC2;transform:translateY(-1px);box-shadow:0 4px 10px rgba(255,138,61,0.3);}
  @keyframes popIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}

  .bank-row{
    display:flex;flex-wrap:wrap;gap:9px;
    margin-bottom:24px;
  }
  .tile{
    all:unset;
    cursor:pointer;
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    padding:10px 17px;
    border-radius:var(--radius-sm);
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(30,41,63,0.05);
    transition:transform .12s cubic-bezier(.3,1.4,.6,1), border-color .15s ease, box-shadow .15s ease;
  }
  .tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 5px 12px rgba(255,138,61,0.18);}
  .tile:active{transform:scale(.94);}

  .action-row{display:flex;gap:10px;}
  .btn-primary, .btn-secondary, .btn-ghost{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14.5px;
    border-radius:999px;
    padding:14px 18px;
    cursor:pointer;
    border:none;
    transition:opacity .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--accent-grad);color:#fff;flex:1;box-shadow:0 8px 18px -4px rgba(255,111,34,0.48);}
  .btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;box-shadow:none;}
  .btn-primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 10px 22px -4px rgba(255,111,34,0.55);}
  .btn-primary:not(:disabled):active{transform:scale(.97) translateY(0);}
  .btn-primary.full{width:100%;}
  .btn-secondary{background:var(--blue-soft);color:var(--blue);width:100%;}
  .btn-secondary:hover{background:#DFE5FF;}
  .btn-secondary.full{width:100%;}
  .btn-ghost{background:transparent;color:var(--ink-soft);width:100%;border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-ghost.full{width:100%;}
  .action-row .btn-ghost{flex:0 0 auto;width:auto;white-space:nowrap;}

  /* ---------- FEEDBACK SCREEN ---------- */
  .feedback-card{text-align:center;}
  .feedback-icon{font-size:44px;margin-bottom:6px;animation:popIn .3s ease;}
  .feedback-title{font-family:var(--font-display);font-weight:900;font-size:22px;margin-bottom:18px;}
  .is-correct .feedback-title{color:var(--correct);}
  .is-incorrect .feedback-title{color:var(--incorrect);}
  .feedback-sentence-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
  .feedback-sentence{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    padding:14px 16px;
    border-radius:var(--radius-md);
    margin-bottom:18px;
  }
  .is-correct .feedback-sentence{background:var(--correct-bg);color:var(--correct);box-shadow:inset 0 0 0 1px rgba(47,174,102,0.18);}
  .is-incorrect .feedback-sentence{background:var(--incorrect-bg);color:var(--incorrect);box-shadow:inset 0 0 0 1px rgba(232,93,93,0.18);}
  .feedback-explanation{
    text-align:left;
    background:var(--bg);
    border-radius:var(--radius-md);
    padding:15px 16px;
    margin-bottom:22px;
    border:1px solid var(--line);
  }
  .exp-label{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:5px;}
  .exp-body{font-size:14px;line-height:1.75;color:var(--ink);}

  /* ---------- RESULTS SCREEN ---------- */
  .results-card{text-align:center;}
  .results-round-label{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .score-ring{
    width:136px;height:136px;border-radius:50%;
    margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    padding:10px;
    box-shadow:var(--shadow-soft);
  }
  .score-ring-inner{
    width:100%;height:100%;border-radius:50%;
    background:var(--surface);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:900;font-size:32px;color:var(--ink);
  }
  .score-ring-inner span{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .score-message{font-size:14.5px;color:var(--ink-soft);margin-bottom:24px;}
  .perfect-msg{
    font-family:var(--font-display);font-weight:700;color:var(--correct);
    background:var(--correct-bg);border-radius:var(--radius-md);
    padding:14px;margin-bottom:22px;font-size:14.5px;
    box-shadow:inset 0 0 0 1px rgba(47,174,102,0.18);
  }
  .review-section{text-align:left;margin-bottom:24px;}
  .review-heading{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:12px;}
  .review-item{
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    margin-bottom:10px;
    transition:border-color .15s ease;
  }
  .review-item:hover{border-color:var(--blue);}
  .review-tag{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:5px;}
  .review-sentence{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:7px;}
  .review-explanation{font-size:13px;line-height:1.7;color:var(--ink-soft);}
  .results-actions{display:flex;flex-direction:column;gap:10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  button:focus-visible, .set-card:focus-visible{
    outline:3px solid var(--blue);
    outline-offset:2px;
  }
</style>
</head>

<div id="app"></div>

<!-- ============ DATA (unit files) ============ -->
<script>
const UNITS = [];

/* 共通の固有名詞・大文字化ルール（docs/data-schema.md 2節） */
const PROPER_NOUNS = {
  "i": "I",
  "english": "English",
  "japan": "Japan",
  "japanese": "Japanese",
  "tokyo": "Tokyo",
  "america": "America",
  "american": "American",
  "monday": "Monday",
  "tuesday": "Tuesday",
  "wednesday": "Wednesday",
  "thursday": "Thursday",
  "friday": "Friday",
  "saturday": "Saturday",
  "sunday": "Sunday",
  "ms.": "Ms.",
  "mr.": "Mr.",
  "mrs.": "Mrs.",
  "rpg games": "RPG games",
  "kyoto": "Kyoto",
  "april": "April",
  "fukuoka": "Fukuoka",
  "may 5th": "May 5th",
  "september": "September",
  "shohei": "Shohei",
  "otani": "Otani",
  "fukui": "Fukui",
  "mike": "Mike",
  "asia": "Asia",
  "ken": "Ken",
  "midori junior high school": "Midori Junior High School",
  "kumi": "Kumi",
  "sendai": "Sendai",
  "italy": "Italy",
  "midori park": "Midori Park",
  "yamagata": "Yamagata"
};

UNITS.push({
  id: "general-verb-basic",
  name: "一般動詞の文（基本）",
  description: "現在形・過去形の基本文",
  questions: [
    {
      id: "general-verb-basic-001",
      bank: ["ken","runs","very","fast","."],
      answer: ["ken","runs","very","fast","."],
      explanation: "主語が3人称単数（Ken）のとき、一般動詞には s がつきます。並び順は「主語→動詞→様子を表す語句」です。",
      alwaysCapitalize: []
    },
    {
      id: "general-verb-basic-002",
      bank: ["i","went","to","the","park","with","my friends","."],
      answer: ["i","went","to","the","park","with","my friends","."],
      explanation: "goの過去形はwentという不規則変化です。並び順は「主語→動詞(過去形)→場所→いっしょにいた人」です。",
      alwaysCapitalize: []
    },
    {
      id: "general-verb-basic-003",
      bank: ["i","run","in","the","park","."],
      answer: ["i","run","in","the","park","."],
      explanation: "主語がI（1人称）のとき、一般動詞はそのままの形を使います。並び順は「主語→動詞→場所を表す語句」です。",
      alwaysCapitalize: []
    },
    {
      id: "general-verb-basic-004",
      bank: ["i","went","to","kyoto","in","april","."],
      answer: ["i","went","to","kyoto","in","april","."],
      explanation: "goの過去形はwentという不規則変化です。並び順は「主語→動詞(過去形)→場所→時を表す語句」です。",
      alwaysCapitalize: []
    },
    {
      id: "general-verb-basic-005",
      bank: ["the","party","starts","at","eleven","."],
      answer: ["the","party","starts","at","eleven","."],
      explanation: "主語が3人称単数（the party）のとき、一般動詞には s がつきます。並び順は「主語→動詞→時を表す語句」です。",
      alwaysCapitalize: []
    },
    {
      id: "general-verb-basic-006",
      bank: ["my sister","lives","in","fukuoka","."],
      answer: ["my sister","lives","in","fukuoka","."],
      explanation: "主語が3人称単数（my sister）のとき、一般動詞には s がつきます。並び順は「主語→動詞→場所を表す語句」です。",
      alwaysCapitalize: []
    }
  ]
});

UNITS.push({
  id: "be-verb",
  name: "be動詞の文",
  description: "主語+be動詞+補語（形容詞・名詞）",
  questions: [
    {
      id: "be-verb-001",
      bank: ["my","friends","are","kind","."],
      answer: ["my","friends","are","kind","."],
      explanation: "主語が複数（my friends）のとき、be動詞は are を使います。「主語→be動詞→形容詞」の順になります。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-002",
      bank: ["my","soccer ball","is","from","my","grandmother","."],
      answer: ["my","soccer ball","is","from","my","grandmother","."],
      explanation: "主語が単数（my soccer ball）のとき、be動詞は is を使います。「主語→be動詞→from+人」の順で出どころを表します。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-003",
      bank: ["that","cat","is","so","cute","."],
      answer: ["that","cat","is","so","cute","."],
      explanation: "主語が単数（that cat）なので be動詞は is になります。「主語→be動詞→so+形容詞」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-004",
      bank: ["he","is","a","famous","scientist","."],
      answer: ["he","is","a","famous","scientist","."],
      explanation: "主語が3人称単数（he）のとき、be動詞は is です。補語が名詞のときは a をつけて表します。「主語→be動詞→a+形容詞+名詞」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-005",
      bank: ["my","birthday","is","may 5th","."],
      answer: ["my","birthday","is","may 5th","."],
      explanation: "主語が単数（my birthday）のとき、be動詞は is を使います。「主語→be動詞→日付（名詞）」の順で表します。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-006",
      bank: ["this","is","my","weekend","schedule","."],
      answer: ["this","is","my","weekend","schedule","."],
      explanation: "this を主語にすると be動詞は is になります。「主語→be動詞→my+名詞+名詞」の順で補語（名詞）を続けます。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-007",
      bank: ["our","sports day","was","in","september","."],
      answer: ["our","sports day","was","in","september","."],
      explanation: "過去のことを言うときは be動詞を was（単数）にします。「主語→be動詞(was)→in+月」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-008",
      bank: ["that","is","a","good","idea","."],
      answer: ["that","is","a","good","idea","."],
      explanation: "that を主語にすると be動詞は is です。補語が名詞のときは a をつけます。「主語→be動詞→a+形容詞+名詞」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-009",
      bank: ["it","is","rainy","today","."],
      answer: ["it","is","rainy","today","."],
      explanation: "天気を言うときは it を主語にし、be動詞は is を使います。「主語→be動詞→形容詞→today」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-010",
      bank: ["my","mother","is","busy","."],
      answer: ["my","mother","is","busy","."],
      explanation: "主語が単数（my mother）のとき、be動詞は is を使います。「主語→be動詞→形容詞」の順です。",
      alwaysCapitalize: []
    },
    {
      id: "be-verb-011",

  'comparative': '⚖️',
  'infinitive': '🎯',
  'gerund': '🎨',
  'passive': '🔄',
  'present-perfect': '⏳',
  'participle': '👀',
  'relative-pronoun': '🔗',
  'idiom': '💬',
  'conjunction': '🧩',
  'subjunctive': '🌈',
  'indirect-question': '❓'
};
function unitIcon(unitId){ return UNIT_ICONS[unitId] || '✏️'; }

/* ============ STATE ============ */
let state = {
  screen:'start',
  unitId:null,
  isReviewRound:false,
  queue:[],
  qIndex:0,
  currentBank:[],
  built:[],
  score:0,
  wrongIds:[],
  answered:[],
  lastResult:null,
  lastScores:{}
};

/* ============ HELPERS ============ */
function getUnit(unitId){
  return UNITS.find(u=>u.id===unitId);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function sameOrder(a,b){
  if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; }
  return true;
}
function readRecent(unitId){
  try{
    const raw = window.localStorage.getItem(RECENT_STORAGE_PREFIX+unitId);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function writeRecent(unitId, ids){
  try{
    window.localStorage.setItem(RECENT_STORAGE_PREFIX+unitId, JSON.stringify(ids));
  }catch(e){ /* localStorage unavailable, ignore */ }
}
function pickRandomQuestions(unit){
  const roundSize = Math.min(MAX_QUESTIONS_PER_ROUND, unit.questions.length);
  const recentIds = readRecent(unit.id);
  let pool = unit.questions.filter(q=>recentIds.indexOf(q.id)===-1);
  if(pool.length < roundSize){ pool = unit.questions; }
  const picked = shuffle(pool).slice(0, roundSize);
  writeRecent(unit.id, picked.map(q=>q.id));
  return picked;
}
function tileLabel(token, question){
  if(question && question.alwaysCapitalize && question.alwaysCapitalize.indexOf(token)!==-1){
    return token.charAt(0).toUpperCase()+token.slice(1);
  }
  const key = token.toLowerCase();
  if(typeof PROPER_NOUNS!=='undefined' && Object.prototype.hasOwnProperty.call(PROPER_NOUNS,key)){
    return PROPER_NOUNS[key];
  }
  return token;
}
function formatDisplay(tokens, question){
  let out='';
  tokens.forEach((t,i)=>{
    let label = tileLabel(t, question);
    if(i===0){ label = label.charAt(0).toUpperCase()+label.slice(1); }
    if(i>0 && (t==='.'||t==='?'||t===',')){ out += label; }
    else if(i===0){ out += label; }
    else { out += ' ' + label; }
  });
  return out;
}
function makeBankTiles(question){
  let shuffled = shuffle(question.bank);
  let attempts=0;
  while(sameOrder(shuffled, question.answer) && attempts<10){
    shuffled = shuffle(question.bank);
    attempts++;
  }
  return shuffled.map((token,i)=>({
    id: 'q'+question.id+'-'+i+'-'+Math.random().toString(36).slice(2,7),
    token, used:false
  }));
}
function scoreRingStyle(score,total){
  const deg = total>0 ? Math.round(score/total*360) : 0;
  return 'background: conic-gradient(var(--correct) 0deg '+deg+'deg, var(--line) '+deg+'deg 360deg);';
}
function scoreMessage(score,total){
  const pct = total>0 ? score/total : 0;
  if(pct===1) return '満点！かんぺきだね！';
  if(pct>=0.8) return 'よくできました！';
  if(pct>=0.6) return 'もう少し！復習して確かめよう。';
  return '復習して、もう一度チャレンジしよう。';
}

/* ============ FLOW ============ */
function startUnit(unitId){
  const unit = getUnit(unitId);
  state.unitId = unitId;
  state.isReviewRound = false;
  state.queue = pickRandomQuestions(unit);
  state.qIndex = 0;
  state.score = 0;
  state.wrongIds = [];
  state.answered = [];
  loadQuestion();
}
function startReview(){
  const ids = state.wrongIds;
  const unit = getUnit(state.unitId);
  state.queue = unit.questions.filter(q=>ids.indexOf(q.id)!==-1);
  state.isReviewRound = true;
  state.qIndex = 0;
  state.score = 0;
  state.wrongIds = [];
  state.answered = [];
  loadQuestion();
}
function retrySameRound(){
  const unit = getUnit(state.unitId);
  const ids = state.queue.map(q=>q.id);
  state.queue = unit.questions.filter(q=>ids.indexOf(q.id)!==-1);
  state.qIndex = 0;
  state.score = 0;
  state.wrongIds = [];
  state.answered = [];
  loadQuestion();
}
function loadQuestion(){
  const q = state.queue[state.qIndex];
  state.currentBank = makeBankTiles(q);
  state.built = [];
  state.screen = 'quiz';
  render();
}
function placeTile(tileId){
  const tile = state.currentBank.find(t=>t.id===tileId);
  if(!tile || tile.used) return;
  tile.used = true;
  state.built.push(tile);
  render();
}
function removeTile(slotIndex){
  const tile = state.built[slotIndex];
  if(!tile) return;
  tile.used = false;
  state.built.splice(slotIndex,1);
  render();
}
function resetBuilt(){
  state.built.forEach(t=>{ t.used=false; });
  state.built = [];
  render();
}
function submitAnswer(){
  const q = state.queue[state.qIndex];
  const builtTokens = state.built.map(t=>t.token);
  const isCorrect = sameOrder(builtTokens, q.answer);
  if(isCorrect){ state.score++; } else { state.wrongIds.push(q.id); }
  state.answered.push(isCorrect);
  state.lastResult = {isCorrect:isCorrect, q:q};
  state.screen = 'feedback';
  render();
}
function nextQuestion(){
  state.qIndex++;
  if(state.qIndex >= state.queue.length){
    state.screen = 'results';
    render();
  } else {
    loadQuestion();
  }
}
function goHome(){
  if(!state.isReviewRound && state.unitId){
    state.lastScores[state.unitId] = {score:state.score, total:state.queue.length};
  }
  state.screen = 'start';
  render();
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='start') app.innerHTML = renderStart();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else if(state.screen==='feedback') app.innerHTML = renderFeedback();
  else if(state.screen==='results') app.innerHTML = renderResults();
}

function lastScoreBadge(unitId){
  const rec = state.lastScores[unitId];
  if(!rec) return '';
  return '<span class="badge">前回 '+rec.score+'/'+rec.total+'</span>';
}

function renderStart(){
  let cards = '';
  UNITS.forEach(unit=>{
    cards += ''+
      '<button class="set-card" onclick="startUnit(\''+unit.id+'\')">'+
        '<div class="set-icon">'+unitIcon(unit.id)+'</div>'+
        '<div class="set-body">'+
          '<div class="set-card-top"><span class="set-num">'+unit.questions.length+'問</span>'+lastScoreBadge(unit.id)+'</div>'+
          '<div class="set-title">'+unit.name+'</div>'+
          '<div class="set-tags">'+unit.description+'</div>'+
        '</div>'+
        '<div class="set-cta">→</div>'+
      '</button>';
  });
  return ''+
  '<div class="card">'+
    '<div class="eyebrow">JUNIOR HIGH ENGLISH GRAMMAR</div>'+
    '<h1 class="title">ならびかえ<br>トレーニング</h1>'+
    '<p class="lead">単元をえらんで、かっこの中の単語をタップして正しい英文を組み立てよう。毎回ランダムに数問（最大5問）出題されるよ。○×判定のあとに解説が出て、まちがえた問題はあとで復習できるよ。</p>'+
    '<div class="set-list">'+cards+'</div>'+
  '</div>';
}

function renderQuiz(){
  const unit = getUnit(state.unitId);
  const q = state.queue[state.qIndex];
  const totalSlots = state.currentBank.length;
  const canSubmit = state.built.length === totalSlots && totalSlots>0;

  let slots='';
  for(let i=0;i<totalSlots;i++){
    const tile = state.built[i];
    if(tile){
      slots += '<button class="slot filled" onclick="removeTile('+i+')">'+tileLabel(tile.token, q)+'</button>';
    } else {
      slots += '<span class="slot empty"></span>';
    }
  }

  let bank='';
  state.currentBank.forEach(tile=>{
    if(!tile.used){
      bank += '<button class="tile" onclick="placeTile(\''+tile.id+'\')">'+tileLabel(tile.token, q)+'</button>';
    }
  });

  let dots='';
  state.queue.forEach((qq,i)=>{
    let cls='dot';
    if(i < state.answered.length){ cls += state.answered[i] ? ' dot-correct' : ' dot-incorrect'; }
    else if(i === state.qIndex){ cls += ' dot-current'; }
    dots += '<span class="'+cls+'"></span>';
  });

  const roundLabel = (state.isReviewRound ? '復習ラウンド' : unit.name) + ' ・ '+(state.qIndex+1)+'/'+state.queue.length+'問目';

  return ''+
  '<div class="card">'+
    '<div class="quiz-header">'+
      '<button class="home-link" onclick="goHome()">← スタートへ</button>'+
      '<div class="progress-dots">'+dots+'</div>'+
    '</div>'+
    '<div class="round-label" style="margin-bottom:14px;">'+roundLabel+'</div>'+
    '<div class="q-tag">'+unit.name+'</div>'+
    '<div class="slot-row">'+slots+'</div>'+
    '<div class="bank-row">'+bank+'</div>'+
    '<div class="action-row">'+
      '<button class="btn-ghost" onclick="resetBuilt()">リセット</button>'+
      '<button class="btn-primary" '+(canSubmit?'':'disabled')+' onclick="submitAnswer()">こたえ合わせ</button>'+
    '</div>'+
  '</div>';
}

function renderFeedback(){
  const isCorrect = state.lastResult.isCorrect;
  const q = state.lastResult.q;
  const isLast = (state.qIndex+1) >= state.queue.length;
  return ''+
  '<div class="card feedback-card '+(isCorrect?'is-correct':'is-incorrect')+'">'+
    '<div class="feedback-icon">'+(isCorrect?'⭕':'❌')+'</div>'+
    '<div class="feedback-title">'+(isCorrect?'正解！':'不正解...')+'</div>'+
    '<div class="feedback-sentence-label">正しい英文</div>'+
    '<div class="feedback-sentence">'+formatDisplay(q.answer, q)+'</div>'+
    '<div class="feedback-explanation">'+
      '<div class="exp-label">解説</div>'+
      '<div class="exp-body">'+q.explanation+'</div>'+
    '</div>'+
    '<button class="btn-primary full" onclick="nextQuestion()">'+(isLast?'けっかを見る →':'つぎの問題へ →')+'</button>'+
  '</div>';
}

function renderResults(){
  const unit = getUnit(state.unitId);
  const total = state.queue.length;
  const score = state.score;
  const wrongList = state.queue.filter(q=>state.wrongIds.indexOf(q.id)!==-1);
  const roundLabel = state.isReviewRound ? '復習ラウンド' : unit.name;

  let reviewHtml='';
  if(wrongList.length>0){
    let items='';
    wrongList.forEach(q=>{
      items += ''+
      '<div class="review-item">'+
        '<div class="review-tag">'+unit.name+'</div>'+
        '<div class="review-sentence">'+formatDisplay(q.answer, q)+'</div>'+
        '<div class="review-explanation">'+q.explanation+'</div>'+
      '</div>';
    });
    reviewHtml = '<div class="review-section"><div class="review-heading">見直しておこう</div>'+items+'</div>';
  } else {
    reviewHtml = '<div class="perfect-msg">全問正解！すばらしい！</div>';
  }

  let actions = '';
  if(wrongList.length>0){
    actions += '<button class="btn-primary full" onclick="startReview()">まちがえた問題だけ復習する（'+wrongList.length+'問）</button>';
  }
  actions += '<button class="btn-secondary full" onclick="retrySameRound()">もう一度さいしょから</button>';
  if(!state.isReviewRound){
    actions += '<button class="btn-secondary full" onclick="startUnit(state.unitId)">この単元をもう一度（べつの問題で）</button>';
  }
  actions += '<button class="btn-ghost full" onclick="goHome()">単元一覧にもどる</button>';

  return ''+
  '<div class="card results-card">'+
    '<div class="results-round-label">'+roundLabel+' ・ けっか</div>'+
    '<div class="score-ring" style="'+scoreRingStyle(score,total)+'">'+
      '<div class="score-ring-inner">'+score+'<span>/'+total+'</span></div>'+
    '</div>'+
    '<div class="score-message">'+scoreMessage(score,total)+'</div>'+
    reviewHtml+
    '<div class="results-actions">'+actions+'</div>'+
  '</div>';
}

render();
</script>
</body>
</html>
